<!DOCTYPE html><!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residència de desenvolupadors</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Inici</a></li>
                <li><a href="./sobre_mi.html">Sobre mi</a></li>
                <li><a href="./Estudis.html">Estudis</a></li>
                <li><a href="./Contacta.html">Contacta amb mi</a></li>
                <li><a href="./residencia.html">Residencia</a></li>
            </ul>
        </nav>
    </header>

    <div class="residencia">
        <h1>Residència de desenvolupadors</h1>
        <p>Omple les teves dades i el teu perfil tècnic.</p>

        <form action="#" method="post">

            <fieldset>
                <legend>Dades personals</legend>

                <label for="nomcog">Nom i cognoms</label>
                <input type="text" id="nomcog" name="nomcog" required>

                <label for="mail">Correu electrònic</label>
                <input type="email" id="mail" name="mail" required>

                <label for="tel">Telèfon</label>
                <input type="tel" id="tel" name="tel" placeholder="9 xifres" pattern="[0-9]{9}">

                <label for="naix">Data de naixement</label>
                <input type="date" id="naix" name="naix" required>

                <label for="pais">País</label>
                <select id="pais" name="pais">
                    <option value="">Tria un país</option>
                    <option value="es">Espanya</option>
                    <option value="fr">França</option>
                    <option value="it">Itàlia</option>
                    <option value="pt">Portugal</option>
                </select>

                <label for="ciutat">Ciutat</label>
                <input type="text" id="ciutat" name="ciutat" list="ciutats">
                <datalist id="ciutats">
                    <option value="Barcelona">
                    <option value="Girona">
                    <option value="Lleida">
                    <option value="Tarragona">
                </datalist>
            </fieldset>

            <fieldset>
                <legend>Perfil tècnic</legend>

                <label for="anys">Anys d'experiència</label>
                <input type="range" id="anys" name="anys" min="0" max="20" value="2">

                <fieldset>
                    <legend>Llenguatges que domines</legend>
                    <label><input type="checkbox" name="llenguatges" value="html"> HTML</label>
                    <label><input type="checkbox" name="llenguatges" value="css"> CSS</label>
                    <label><input type="checkbox" name="llenguatges" value="js"> JavaScript</label>
                    <label><input type="checkbox" name="llenguatges" value="php"> PHP</label>
                    <label><input type="checkbox" name="llenguatges" value="python"> Python</label>
                    <label><input type="checkbox" name="llenguatges" value="java"> Java</label>
                </fieldset>

                <fieldset>
                    <legend>Nivell d'anglès</legend>
                    <label><input type="radio" name="angles" value="A2"> A2</label>
                    <label><input type="radio" name="angles" value="B1"> B1</label>
                    <label><input type="radio" name="angles" value="B2"> B2</label>
                    <label><input type="radio" name="angles" value="C1"> C1</label>
                </fieldset>

                <label for="rols">Rols preferits</label>
                <select id="rols" name="rols" multiple size="4">
                    <option value="frontend">Frontend</option>
                    <option value="backend">Backend</option>
                    <option value="devops">DevOps</option>
                    <option value="dades">Dades</option>
                </select>

                <label for="github">URL de GitHub</label>
                <input type="url" id="github" name="github" placeholder="https://github.com/usuari">
            </fieldset>

            <div class="botons-form">
                <button type="reset" class="btn-reset">Esborra-ho tot</button>
                <button type="submit" class="btn-envia">Envia</button>
            </div>
        </form>
    </div>

    <footer>&copy; Sóc el Narcís Vitores</footer>
</body>

</html>
