    <h1>Contacta amb mi</h1>

<form class="formulari-contacte" action="#" method="post">

    <div class="camp">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom..." required>
    </div>

    <div class="camp">
        <label for="email">Correu electrònic</label>
        <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
    </div>

    <div class="camp">
        <label for="assumpte">Assumpte</label>
        <input type="text" id="assumpte" name="assumpte" placeholder="Motiu del missatge..." required>
    </div>

    <div class="camp">
        <label for="missatge">Missatge</label>
        <textarea id="missatge" name="missatge" placeholder="Escriu el teu missatge aquí..." required></textarea>
    </div>

    <button type="submit">Enviar missatge</button>
</form>
